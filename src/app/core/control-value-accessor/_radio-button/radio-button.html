<div [class.flex-col]="align() === 'vertical'" class="flex gap-x-4 gap-y-2">
    @for (cat of options(); track cat.label) {
        <div class="flex gap-2">
            <p-radiobutton
                [inputId]="cat.label + cat.value"
                [disabled]="ViewModes.includes(actionEvents())"
                name="label"
                variant="filled"
                [value]="cat.value"
                (ngModelChange)="changeRadio($event)"
                [(ngModel)]="value"
            ></p-radiobutton>
            <label [for]="cat.label + cat.value" class="ml-2">{{ cat.label }}</label>
        </div>
    }
</div>
