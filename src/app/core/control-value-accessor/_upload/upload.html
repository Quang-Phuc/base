<label for="upload-control">
    <p-fileupload
        (onClear)="onClearAll()"
        (onSelect)="onSelectedFiles($event)"
        (onUpload)="onTemplatedUpload()"
        [disabled]="ViewModes.includes(actionEvents())"
        [files]="fileSelected()"
        [maxFileSize]="maxSizePerFile()"
        [multiple]="multipleUpload()"
        [name]="ngControl.name + ''"
        accept="image/*"
        mode="advanced"
    >
        <ng-template
            #header
            let-chooseCallback="chooseCallback"
            let-clearCallback="clearCallback"
            let-files
            let-uploadCallback="uploadCallback"
        >
            <div class="flex flex-wrap justify-between items-center flex-1 gap-4">
                <div class="flex gap-2">
                    <p-button
                        (onClick)="choose($event, chooseCallback)"
                        [outlined]="true"
                        [rounded]="true"
                        icon="pi pi-images"
                    />
                    <p-button
                        (onClick)="uploadEvent(uploadCallback)"
                        [disabled]="!files || files.length === 0"
                        [outlined]="true"
                        [rounded]="true"
                        icon="pi pi-cloud-upload"
                        severity="success"
                    />
                    <p-button
                        (onClick)="clearCallback()"
                        [disabled]="!files || files.length === 0"
                        [outlined]="true"
                        [rounded]="true"
                        icon="pi pi-times"
                        severity="danger"
                    />
                </div>
            </div>
        </ng-template>
        <ng-template
            #content
            let-files
            let-removeFileCallback="removeFileCallback"
            let-removeUploadedFileCallback="removeUploadedFileCallback"
            let-uploadedFiles="uploadedFiles"
        >
            <div class="flex flex-col gap-8 pt-4">
                <div class="flex flex-wrap gap-4">
                    @for (file of files; track file) {
                        <div
                            class="p-8 rounded-border flex flex-col justify-between border border-surface items-center gap-4"
                        >
                            <div>
                                <img
                                    role="presentation"
                                    [alt]="file.name"
                                    [src]="file.objectURL"
                                    width="100"
                                    height="50"
                                />
                            </div>
                            <div class="flex flex-col items-center gap-2">
                                <span class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden">
                                    {{ file.name }}
                                </span>
                                <div>{{ formatSize(file.size) }}</div>
                                <p-button
                                    icon="pi pi-times"
                                    (click)="onRemoveTemplatingFile($event, file, removeFileCallback, $index)"
                                    [outlined]="true"
                                    [rounded]="true"
                                    severity="danger"
                                />
                            </div>
                        </div>
                    }
                </div>
            </div>
        </ng-template>
        <ng-template #empty>
            <ng-content select="[empty]"></ng-content>
        </ng-template>
    </p-fileupload>
</label>
<input (blur)="onBlur()" id="upload-control" style="margin-top: -20px; display: block" type="text" />
<ase-input-error [control]="ngControl.control"></ase-input-error>
